<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DataStore - File Gallery</title>
    <!-- Tailwind CSS v3 with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- lightbox -->
    <link href="%{{ url_for('static', filename='css/lightbox.min.css') }}%"
          media="screen,projection"
          rel="stylesheet"
          type="text/css"/>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style data-purpose="typography">
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
    <style data-purpose="layout">
        /* Subtle hover effect for file cards */
        .file-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body class="bg-[#0f1414] text-slate-200 min-h-screen flex flex-col">
    <span id="app">
        <!-- BEGIN: MainHeader -->
        <header class="bg-[#1a2121] border-b border-[#2a3535] sticky top-0 z-10" data-purpose="main-navigation">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between py-4 gap-4">
                    <!-- BEGIN: Breadcrumbs -->
                    <nav aria-label="Breadcrumb" class="flex items-center text-sm font-medium text-slate-400">
                        <ol class="flex items-center flex-wrap gap-1.5 sm:gap-2">
                            <li v-for="(item, index) in openDirs" :key="item.id" class="inline-flex items-center">
                                <!-- Separator (slash) for items after root -->
                                <span v-if="index > 0" class="text-slate-600 select-none mr-1.5 sm:mr-2">/</span>

                                <!-- Root element: Home icon only -->
                                <button v-if="index === 0"
                                    type="button"
                                    @click="index !== openDirs.length - 1 ? goToDir(0) : null"
                                    :class="[index === openDirs.length - 1 ? 'text-slate-200 cursor-default' : 'text-slate-400 hover:text-emerald-400 cursor-pointer', 'inline-flex items-center transition-colors focus:outline-none']"
                                    title="Home"
                                    aria-label="Home">
                                    <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                                    </svg>
                                </button>

                                <!-- Current folder (last item) -->
                                <span v-else-if="index === openDirs.length - 1"
                                    class="text-slate-200 font-semibold truncate max-w-[200px] sm:max-w-xs"
                                    aria-current="page"
                                    :title="item.name">
                                    {{ item.name }}
                                </span>

                                <!-- Ancestor folder link -->
                                <button v-else
                                    type="button"
                                    @click="goToDir(index)"
                                    class="hover:text-emerald-400 transition-colors cursor-pointer truncate max-w-[150px] sm:max-w-xs focus:outline-none"
                                    :title="item.name">
                                    {{ item.name }}
                                </button>
                            </li>
                        </ol>
                    </nav>
                    <!-- END: Breadcrumbs -->
                    <!-- BEGIN: ActionBar -->
                    <div class="flex items-center space-x-4" data-purpose="action-controls">
                        <div class="flex items-center mr-2">
                            <label class="inline-flex items-center cursor-pointer" v-on:click="toggleView">
                                <span class="mr-2 text-sm text-slate-400">Show All Images</span>
                                <input class="sr-only peer" type="checkbox" value="" />
                                <div
                                    class="relative w-11 h-6 bg-slate-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-emerald-900/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600">
                                </div>
                            </label>
                        </div>
                        <button v-on:click="window.open(pageAddress + '/zipDir/' + currentDir + (isFlatView?'?flat=yes':''), '_blank')"
                            class="inline-flex items-center px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 transition-colors shadow-sm"
                            type="button">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                            Download Directory
                        </button>
                    </div>
                    <!-- END: ActionBar -->
                </div>
            </div>
        </header>
        <!-- END: MainHeader -->
        <!-- BEGIN: MainContent -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"
                id="file-grid">
                <span v-if="error">
                    Error happened.
                </span>
                <span v-else-if="loading">
                    <div class="progress">
                        <div class="indeterminate"></div>
                    </div>
                </span>
                <component
                    v-for="item in displayedItems"
                    v-bind:is="resolveItemComponent(item)"
                    v-bind:key="item.type + '-' + item.id"
                    v-bind:item="item"
                    v-bind:current_dir="currentDir +'\\'"
                    v-bind:page_address="pageAddress"
                    @open_item="openItem"
                    @open_video="openVideo">
                </component>
            </div>
        </main>
        <!-- END: MainContent -->
        <div v-if="activeVideo" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4"
            v-on:click.self="closeVideo">
            <div class="relative w-full max-w-5xl bg-[#1a2121] rounded-xl border border-[#2a3535] shadow-2xl overflow-hidden">
                <div class="flex items-center justify-between px-4 py-3 border-b border-[#2a3535]">
                    <span class="text-sm font-medium text-slate-200 truncate pr-4" title="{{ activeVideo.name }}">{{ activeVideo.name }}</span>
                    <button type="button" class="text-slate-400 hover:text-white transition-colors" v-on:click="closeVideo" aria-label="Close">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <video ref="videoPlayer" class="w-full max-h-[80vh] bg-black" controls autoplay
                    :src="activeVideoUrl" :poster="activeVideoPoster"></video>
            </div>
        </div>
        <!-- BEGIN: Footer -->
        <footer class="mt-auto py-8 border-t border-[#1a2121] bg-[#0f1414]">
            <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
                <p><a href="https://github.com/marekw96/webGallery">webGallery</a> | simple webGallery page</p>
            </div>
        </footer>
    </span>
    <!-- END: Footer -->
    <script src="%{{ url_for('static', filename='js/lightbox-plus-jquery.min.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/axios.min.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/vue.min.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/vue-lazyload.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/materialize.min.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/layout.js') }}%" type="text/javascript"></script>
    <script src="%{{ url_for('static', filename='js/app.js') }}%" type="text/javascript"></script>
</body>

</html>
